
services:
  mariadb:
    container_name: mariadb
    image: mariadb
    build: requirements/mariadb
    env_file:
      - .env
    environment:
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$(cat $$MYSQL_PASSWORD_FILE)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  wordpress:
    container_name: wordpress
    image: wordpress
    build: requirements/wordpress
    env_file:
      - .env
    environment:
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password
      WP_USER_PASSWORD_FILE: /run/secrets/wp_user_password
    expose:
      - "9000"
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "wp --path=/var/www/html --allow-root core is-installed >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx
    build: requirements/nginx
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html  # monter WordPress en lecture seule
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      wordpress:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

networks:
  inception:
    driver: bridge
