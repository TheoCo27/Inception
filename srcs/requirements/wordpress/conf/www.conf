# Pool PHP-FPM "www" utilise par le site WordPress.
[www]

# Utilisateur systeme qui execute les workers PHP.
user = www-data
# Groupe systeme associe.
group = www-data

# Socket TCP ecoutee par PHP-FPM (Nginx se connecte sur wordpress:9000).
listen = 0.0.0.0:9000
# Proprietaire logique du listener.
listen.owner = www-data
# Groupe logique du listener.
listen.group = www-data

# Mode dynamique: PHP-FPM adapte le nombre de workers a la charge.
pm = dynamic
# Limite haute du nombre de processus PHP simultanes.
pm.max_children = 10
# Nombre de workers demarres immediatement.
pm.start_servers = 4
# Minimum de workers inactifs a conserver.
pm.min_spare_servers = 2
# Maximum de workers inactifs avant reduction.
pm.max_spare_servers = 6
