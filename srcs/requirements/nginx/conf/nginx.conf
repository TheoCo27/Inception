# Utilisateur systeme utilise pour les workers Nginx (moindre privilege).
user www-data;
# Nombre de processus worker adapte automatiquement au CPU.
worker_processes auto;
# Emplacement du fichier PID principal de Nginx.
pid /run/nginx.pid;
# Charge les modules Nginx actives par le package Debian.
include /etc/nginx/modules-enabled/*.conf;

events {
	# Nombre max de connexions simultanees par worker.
	worker_connections 768;
	# Option desactivee ici: accepter plusieurs connexions a la fois par event loop.
	# multi_accept on;
}

http {
	##
	# Reglages HTTP de base
	##

	# Utilise sendfile pour transferer les fichiers statiques efficacement.
	sendfile on;
	# Optimisation de l'envoi des paquets TCP.
	tcp_nopush on;
	# Reduit la latence en desactivant le buffering Nagle.
	tcp_nodelay on;
	# Temps de maintien d'une connexion keep-alive.
	keepalive_timeout 65;
	# Taille de hash pour les types MIME (evite des warnings).
	types_hash_max_size 2048;
	# Option de securite souvent activee en prod pour cacher la version Nginx.
	# server_tokens off;

	# Reglages hashes de noms de serveur (inutiles ici mais gardes en reference).
	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	# Mapping extensions -> Content-Type.
	include /etc/nginx/mime.types;
	# Type par defaut si extension inconnue.
	default_type application/octet-stream;

	##
	# Logs d'acces et d'erreur
	##

	# Journalise chaque requete HTTP.
	access_log /var/log/nginx/access.log;
	# Journalise les erreurs serveur.
	error_log /var/log/nginx/error.log;

	##
	# Compression Gzip
	##

	# Active la compression des reponses compatibles.
	gzip on;

	# Virtual host HTTPS pour WordPress.
	server {
		# Ecoute en TLS sur le port 443.
		listen 443 ssl;
		# Nom de domaine attendu dans l'Host header.
		server_name tcohen.42.fr;

		# Racine des fichiers WordPress montee via volume partage.
		root /var/www/html;               # volume monté avec wordpress_data
		# Ordre de resolution des index.
		index index.php index.html index.htm;
		# Limite la taille des uploads (media WordPress).
		client_max_body_size 64M;

		# Certificat et cle privee TLS.
		ssl_certificate /etc/nginx/ssl/inception.crt;
		ssl_certificate_key /etc/nginx/ssl/inception.key;
		# Force des versions TLS modernes.
		ssl_protocols TLSv1.2 TLSv1.3;
		# Priorise les suites chiffrees du serveur.
		ssl_prefer_server_ciphers on;

		# Essaie d'abord un fichier statique, sinon redirige vers index.php (front controller WordPress).
		location / {
			try_files $uri $uri/ /index.php?$args;
		}

		# Envoie les scripts PHP au backend PHP-FPM du service wordpress.
		location ~ \.php$ {
			# Parametres FastCGI standards (REQUEST_METHOD, QUERY_STRING, etc.).
			include fastcgi_params;        # snippets/fastcgi-php.conf fonctionne aussi
			# Nom du service Docker + port PHP-FPM.
			fastcgi_pass wordpress:9000;   # le service WordPress Docker
			# Chemin absolu du script PHP a executer.
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			# Fichier index PHP par defaut.
			fastcgi_index index.php;
		}
}

}

